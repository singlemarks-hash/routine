name: Android APK (수동)

# 에뮬레이터·실기기에 바로 설치할 debug APK를 만들어 아티팩트로 올린다.
# 로컬에 Android SDK를 갖추지 않아도 '지금 코드'를 손에 받아 볼 수 있게 하는 용도.
# 수동 실행 전용(workflow_dispatch) — 매 푸시마다 돌리면 러너 시간만 낭비된다.
# (컴파일 검증은 android-build.yml이 push/PR마다 이미 수행한다)
on:
  workflow_dispatch:

jobs:
  apk:
    name: Debug APK 빌드
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17 설정
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 설정 (래퍼 + 캐시)
        uses: gradle/actions/setup-gradle@v4

      # debug 빌드 — 축소(minify) 없이 debug 키로 서명되므로 설치에 별도 준비가 필요 없다
      - name: assembleDebug
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # 16KB 페이지 정렬 진단 — Play 오류('앱이 16KB 메모리 페이지 크기를 지원하지 않습니다')의
      # 범인 .so를 특정한다. LOAD 세그먼트 p_align < 16384 인 네이티브 라이브러리가 원인.
      - name: 16KB ELF 정렬 검사
        run: |
          python3 - android/app/build/outputs/apk/debug/app-debug.apk <<'PY'
          import zipfile, struct, sys
          z = zipfile.ZipFile(sys.argv[1])
          rows = []
          for n in sorted(z.namelist()):
              if not n.endswith('.so'): continue
              d = z.read(n)
              if d[:4] != b'\x7fELF': continue
              is64 = d[4] == 2
              if is64:
                  phoff = struct.unpack_from('<Q', d, 0x20)[0]
                  phentsize = struct.unpack_from('<H', d, 0x36)[0]
                  phnum = struct.unpack_from('<H', d, 0x38)[0]
              else:
                  phoff = struct.unpack_from('<I', d, 0x1c)[0]
                  phentsize = struct.unpack_from('<H', d, 0x2a)[0]
                  phnum = struct.unpack_from('<H', d, 0x2c)[0]
              worst = None
              for i in range(phnum):
                  off = phoff + i * phentsize
                  ptype = struct.unpack_from('<I', d, off)[0]
                  if ptype == 1:
                      a = struct.unpack_from('<Q', d, off + 0x30)[0] if is64 else struct.unpack_from('<I', d, off + 0x1c)[0]
                      worst = a if worst is None else min(worst, a)
              rows.append(('OK ' if (worst or 0) >= 16384 else 'BAD', worst, n))
          for st, a, n in rows: print(st, str(a).rjust(6), n)
          bad = [r for r in rows if r[0] == 'BAD']
          print(f"\n{len(bad)} misaligned .so / {len(rows)} total")
          PY

      - name: APK 업로드
        uses: actions/upload-artifact@v4
        with:
          name: angrymoti-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

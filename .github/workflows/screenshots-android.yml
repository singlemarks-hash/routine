name: Screenshots (Android)

# G2 스크린샷 캡처 (docs/영어화-설계도.md §2)
# 에뮬레이터에서 ScreenshotTour를 돌려 화면 PNG를 아티팩트로 남긴다.
# 자주 돌 필요가 없고 에뮬레이터 부팅이 느려서 수동 트리거(workflow_dispatch)만 둔다.
on:
  workflow_dispatch:
    inputs:
      locale:
        description: "캡처 로케일 (ko | en)"
        default: "ko"
        required: true

jobs:
  capture:
    name: 에뮬레이터 캡처 (${{ inputs.locale }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # shots-<locale> 브랜치 강제 푸시용 (Claude 샌드박스가 아티팩트 CDN에 접근 불가 → git 경유 회수)
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: KVM 활성화
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: JDK 17 설정
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 설정 (래퍼 + 캐시)
        uses: gradle/actions/setup-gradle@v4

      - name: 에뮬레이터 실행 + 캡처
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          working-directory: android
          # 주의: 이 액션은 script의 각 줄을 '별개 명령'으로 실행한다 — 백슬래시 줄바꿈 금지.
          # 캡처 회수는 TestStorage 경유: 테스트가 PNG를 TestStorage에 쓰면 AGP가 테스트 종료
          # (=앱 언인스톨) 전에 build/outputs/connected_android_test_additional_output/으로
          # 자동으로 끌어온다. (앱 저장소 직접 쓰기 + adb pull은 언인스톨에 지워져 실패했었다)
          script: |
            ./gradlew :app:connectedDebugAndroidTest --no-daemon -Pandroid.testInstrumentationRunnerArguments.locale=${{ inputs.locale }}

      - name: 스크린샷 아티팩트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ inputs.locale }}
          path: android/app/build/outputs/connected_android_test_additional_output/
          if-no-files-found: warn

      # Claude 샌드박스는 아티팩트 CDN(Azure blob)이 프록시에 막혀 있다 —
      # 검수용 사본을 전용 고아 브랜치(shots-<locale>)로 강제 푸시해 git으로 회수한다.
      - name: 캡처를 shots-${{ inputs.locale }} 브랜치로 푸시
        if: always()
        run: |
          SRC=android/app/build/outputs/connected_android_test_additional_output
          [ -d "$SRC" ] || { echo "캡처 없음 — 푸시 생략"; exit 0; }
          mkdir -p /tmp/shots
          find "$SRC" -name '*.png' -exec cp {} /tmp/shots/ \;
          ls -la /tmp/shots
          cd /tmp/shots
          git init -q -b shots-${{ inputs.locale }}
          git config user.name "screenshot-bot"
          git config user.email "actions@users.noreply.github.com"
          git add . && git commit -qm "capture run ${{ github.run_id }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:refs/heads/shots-${{ inputs.locale }}

      # 실패 시 원인 추적용 — 인스트루먼트 테스트 리포트도 함께 남긴다
      - name: 테스트 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ inputs.locale }}
          path: android/app/build/reports/androidTests/
          if-no-files-found: ignore

name: Screenshots (Android)

# G2 스크린샷 캡처 (docs/영어화-설계도.md §2)
# 에뮬레이터에서 ScreenshotTour를 돌려 화면 PNG를 아티팩트로 남긴다.
# 자주 돌 필요가 없고 에뮬레이터 부팅이 느려서 수동 트리거(workflow_dispatch)만 둔다.
on:
  workflow_dispatch:
    inputs:
      locale:
        description: "캡처 로케일 (ko | en)"
        default: "ko"
        required: true

jobs:
  capture:
    name: 에뮬레이터 캡처 (${{ inputs.locale }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: KVM 활성화
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: JDK 17 설정
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 설정 (래퍼 + 캐시)
        uses: gradle/actions/setup-gradle@v4

      - name: 에뮬레이터 실행 + 캡처
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          working-directory: android
          # 주의: 이 액션은 script의 각 줄을 '별개 명령'으로 실행한다 — 백슬래시 줄바꿈 금지.
          # 테스트가 일부 실패해도 성공한 캡처는 회수해야 하므로(디버깅 재료),
          # pull을 먼저 하고 gradle 종료 코드로 마무리한다.
          # leaveApksInstalledAfterTest: AGP는 테스트가 끝나면 앱을 언인스톨해 앱 데이터
          # (외부 files 디렉터리의 캡처 포함)가 통째로 사라진다 — 유지시켜야 pull이 가능하다.
          # adb root: API 30+ 스코프드 스토리지로 shell 권한은 /sdcard/Android/data를 못 읽는다 —
          # default(AOSP) 이미지라 루트 전환이 가능하다. 재시작 직후 오프라인이라 ready 루프로 대기.
          script: |
            ./gradlew :app:connectedDebugAndroidTest --no-daemon -Pandroid.injected.androidTest.leaveApksInstalledAfterTest=true -Pandroid.testInstrumentationRunnerArguments.locale=${{ inputs.locale }} ; RC=$? ; adb root ; for i in $(seq 1 20) ; do adb shell echo ready 2>/dev/null | grep -q ready && break ; sleep 2 ; done ; adb devices ; D=$(adb shell find /data/media /data/user /storage/emulated -type d -name screenshots 2>/dev/null | head -1 | tr -d '\r') ; echo "shots dir=[$D]" ; if [ -n "$D" ] ; then adb pull "$D" ../captured-shots ; else echo "-- 진단: 캡처 디렉터리 미발견" ; adb shell ls /data/media/0/Android/data ; adb shell ls -la /data/user/0/com.selfer.angrymoti ; adb shell find /data -name "*-home.png" ; fi ; exit $RC

      - name: 스크린샷 아티팩트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ inputs.locale }}
          path: captured-shots/
          if-no-files-found: warn

      # 실패 시 원인 추적용 — 인스트루먼트 테스트 리포트도 함께 남긴다
      - name: 테스트 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ inputs.locale }}
          path: android/app/build/reports/androidTests/
          if-no-files-found: ignore
